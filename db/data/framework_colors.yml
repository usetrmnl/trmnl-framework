# TRMNL Framework - Canonical color palette data
# Single source of truth for color tokens. Consumed by:
#   - lib/tasks/framework.rake (SCSS generation)
#   - lib/framework/color_manifest.rb (resolved manifest + grayscale fallback mappings)
#
# Regenerate SCSS with: rake framework:color_tokens
# The color-to-gray fallback map is computed in lib/framework/color_manifest.rb
# and baked into the generated SCSS by that task.

color_hues:
  - red
  - orange
  - yellow
  - lime
  - green
  - cyan
  - blue
  - violet
  - purple
  - pink

color_shade_steps:
  - 10
  - 15
  - 20
  - 25
  - 30
  - 35
  - 40
  - 45
  - 50
  - 55
  - 60
  - 65
  - 70
  - 75

