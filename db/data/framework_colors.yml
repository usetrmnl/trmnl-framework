# Limited palette IDs (use dither patterns)
color_palette_limited_ids:
  - "3bwr"
  - "3bwy"
  - "4bwry"
  - "6a"
  - "7a"

# Device-accurate colors for alternate docs preview mode (Preview Colors).
# Default preview remains full-bright "actual" color patterns.
preview_color_map:
  red: "#A02020"
  yellow: "#F0E050"
  green: "#608050"
  blue: "#5080B8"
  white: "#FFFFFF"

# Effective "white" used by preview mode for limited palettes that
# render grayscale areas in 1-bit (black + white-only) mode.
preview_limited_palette_white_hex: "#DBDBDB"

# Palettes where preview mode color remapping is applied.
preview_palette_ids:
  - "3bwr"
  - "3bwy"
  - "4bwry"
  - "6a"
  - "7a"

# Limited palettes that use 1-bit grayscale for gray tokens (only black and white available for gray)
limited_palette_grayscale_1bit_ids:
  - "3bwr"
  - "3bwy"
  - "4bwry"
  - "6a"
  - "7a"

# Limited palette hex arrays for image generation
limited_palettes:
  color-3bwr:
    - "#000000"
    - "#FF0000"
    - "#FFFFFF"
  color-3bwy:
    - "#000000"
    - "#FFFF00"
    - "#FFFFFF"
  color-4bwry:
    - "#000000"
    - "#FF0000"
    - "#FFFFFF"
    - "#FFFF00"
  color-6a:
    - "#FF0000"
    - "#00FF00"
