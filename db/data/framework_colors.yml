    - "#FFFF00"
    - "#000000"
    - "#FFFFFF"
  color-7a:
    - "#000000"
    - "#FFFFFF"
    - "#FF0000"
    - "#00FF00"
    - "#0000FF"
    - "#FFFF00"
    - "#FFA500"

