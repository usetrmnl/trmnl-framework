picker_palettes:
- id: bw
  name: Black & White (1-bit)
  grays: 2
  framework_class: screen--1bit
- id: gray-4
  name: 4 Grays (2-bit)
  grays: 4
  framework_class: screen--2bit
- id: gray-16
  name: 16 Grays (4-bit)
  grays: 16
  framework_class: screen--4bit
- id: gray-256
  name: Smooth Grayscale (device-quantized)
  grays: 256
  framework_class: screen--4bit
- id: color-3bwr
  name: Color (3 colors)
  grays: 2
  colors:
  - "#000000"
