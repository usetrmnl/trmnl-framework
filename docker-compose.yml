services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      HOST: 0.0.0.0
      RAILS_ENV: development
      DOCKER: "1"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  bundle_cache:
  node_modules:
