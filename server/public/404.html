<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Page not found · TRMNL Framework</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
      Static, because Rails serves it with the app out of the picture: no stylesheet
      link, no font request, no asset digest to go stale. The palette is the docs
      chrome's gray-100 / gray-800 pair.
    -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f0ed;
        color: #1f2937;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.6;
      }
      main { max-width: 32rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.5rem; color: #4b5563; }
      a { color: #1f2937; }
      @media (prefers-color-scheme: dark) {
        body { background: #1f2022; color: #e5e7eb; }
        p { color: #9ca3af; }
        a { color: #e5e7eb; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The page you asked for is not here. It may have moved between framework versions.</p>
      <p><a href="/framework">Go to the TRMNL Framework docs</a></p>
    </main>
  </body>
</html>
